<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ExploreUP — Favorites</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f4f8fc;color:#10233f}.wrap{width:min(900px,92%);margin:40px auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.back{color:#0b67d1;font-weight:800;text-decoration:none}.card{background:#fff;border:1px solid #e3ebf5;border-radius:16px;padding:16px;margin:12px 0;display:flex;justify-content:space-between;gap:12px;align-items:center}.meta{color:#60708a;font-size:13px}.remove{border:0;border-radius:10px;padding:9px 12px;background:#ffe9e9;color:#a32323;font-weight:800;cursor:pointer}.empty{background:#fff;border-radius:16px;padding:25px;color:#60708a}</style></head><body><main class="wrap"><div class="top"><h1>❤️ My Favorites</h1><a class="back" href="./index-1.html">← ExploreUP</a></div><div id="list"></div></main><script src="./v21-step3-favorites.js?v=20260916-1"></script><script>function render(){const list=document.getElementById('list'),items=window.ExploreUPFavorites?.all()||[];list.innerHTML=items.length?items.map((x,i)=>`<div class="card"><div><strong>${String(x.name).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}</strong><div class="meta">${x.type||'Place'}${x.city?' · '+x.city:''}</div></div><button class="remove" data-i="${i}">Remove</button></div>`).join(''):'<div class="empty">No favorites saved yet. Use the ♡ Save buttons on supported ExploreUP cards.</div>';list.querySelectorAll('.remove').forEach(b=>b.onclick=()=>{const x=items[Number(b.dataset.i)];window.ExploreUPFavorites.remove(x.name,x.city||'');render()})}render();</script></body></html>
