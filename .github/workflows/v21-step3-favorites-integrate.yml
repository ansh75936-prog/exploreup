name: V21 Step 3 Favorites integration
on:
  push:
    branches: [v21-step3-favorites-20260916]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate favorites helper safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index-1.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./v21-step3-favorites.js?v=20260916-1"></script>'
          if tag not in s:
              marker='</body>'
              if marker not in s:
                  raise SystemExit('No </body> marker found')
              s=s.replace(marker,tag+'\n'+marker,1)
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-1.html
          git diff --cached --quiet || git commit -m 'Integrate V21 Favorites into homepage'
          git push
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/v21-step3-favorites-integrate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Remove temporary V21 Step 3 integration workflow'
          git push
