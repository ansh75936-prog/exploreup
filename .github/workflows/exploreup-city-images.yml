name: ExploreUP city image integration
on:
  push:
    paths:
      - "exploreup-city-images-trigger.txt"
concurrency:
  group: exploreup-city-images-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Safely integrate local city image script
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index-1.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./exploreup-city-images.js?v=20260921"></script>'
          pattern = r'<script\s+src=["\']\./exploreup-city-images\.js(?:\?[^"\']*)?["\']\s*></script>'
          if re.search(pattern, s):
              s = re.sub(pattern, tag, s, count=1)
          else:
              marker = '</body>'
              if marker in s:
                  s = s.replace(marker, '  ' + tag + '\n' + marker, 1)
              else:
                  s += '\n' + tag + '\n'
          p.write_text(s, encoding='utf-8')
          Path('exploreup-city-images-trigger.txt').unlink(missing_ok=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-1.html exploreup-city-images-trigger.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update ExploreUP image script cache version"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            echo "Push race detected; retry $i/5"
            sleep 5
          done
          exit 1
