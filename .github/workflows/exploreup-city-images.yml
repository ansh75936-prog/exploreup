name: ExploreUP city image integration
on:
  push:
    paths:
      - "exploreup-city-images-trigger.txt"
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add local city image script to the live page
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index-1.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./exploreup-city-images.js"></script>'
          if tag not in s:
              marker = '</body>'
              if marker in s:
                  s = s.replace(marker, '  ' + tag + '\n' + marker, 1)
              else:
                  s += '\n' + tag + '\n'
              p.write_text(s, encoding='utf-8')
          Path('exploreup-city-images-trigger.txt').unlink(missing_ok=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-1.html exploreup-city-images-trigger.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Integrate new local city photos into ExploreUP"
          git push
