name: ExploreUP city image integration
on:
  push:
    paths:
      - "exploreup-city-images-trigger.txt"
concurrency:
  group: exploreup-city-images-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Safely integrate local city image and Arya scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index-1.html')
          s = p.read_text(encoding='utf-8')
          tags = [
              '<script src="./exploreup-city-images.js?v=20260923"></script>',
              '<script src="./arya-v20-district-aliases.js?v=20260915"></script>',
              '<script src="./arya-v21-routing-fix.js?v=20260916"></script>',
              '<script src="./arya-ai-bridge.js?v=20260916"></script>',
              '<script src="./arya-ai-ui.js?v=20260916"></script>'
          ]
          patterns = [
              (r'<script\s+src=["\']\./exploreup-city-images\.js(?:\?[^"\']*)?["\']\s*></script>', tags[0]),
              (r'<script\s+src=["\']\./arya-v20-district-aliases\.js(?:\?[^"\']*)?["\']\s*></script>', tags[1]),
              (r'<script\s+src=["\']\./arya-v21-routing-fix\.js(?:\?[^"\']*)?["\']\s*></script>', tags[2]),
              (r'<script\s+src=["\']\./arya-ai-bridge\.js(?:\?[^"\']*)?["\']\s*></script>', tags[3]),
              (r'<script\s+src=["\']\./arya-ai-ui\.js(?:\?[^"\']*)?["\']\s*></script>', tags[4])
          ]
          for pattern, tag in patterns:
              if re.search(pattern, s):
                  s = re.sub(pattern, tag, s, count=1)
              else:
                  marker = '</body>'
                  s = s.replace(marker, '  ' + tag + '\n' + marker, 1) if marker in s else s + '\n' + tag + '\n'
          bad = re.compile(r'I only answer questions about information and features available inside ExploreUP\.\s*Arya knows the 75-district guides, district-wise Hotels/Stays and Hospitals, Trip Plan Maker, Budget Calculator, Smart Recommendations, and Quick/Smart planning modes\.', re.I)
          replacement = 'I can help with Uttar Pradesh travel, destinations, places, food, hotels, hospitals, shopping, transport, history, culture, trip plans and ExploreUP features.'
          s = bad.sub(replacement, s)
          p.write_text(s, encoding='utf-8')
          Path('exploreup-city-images-trigger.txt').unlink(missing_ok=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- index-1.html exploreup-city-images-trigger.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Connect Arya UI directly to OpenAI backend"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            echo "Push race detected; retry $i/5"
            sleep 5
          done
          exit 1
