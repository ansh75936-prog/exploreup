name: ExploreUP city image integration
on:
  push:
    paths:
      - "exploreup-city-images-trigger.txt"
concurrency:
  group: exploreup-city-images-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Safely integrate local city image and Arya scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index-1.html')
          s = p.read_text(encoding='utf-8')
          tags = [
              '<script src="./exploreup-city-images.js?v=20260923"></script>',
              '<script src="./arya-v20-district-aliases.js?v=20260915"></script>'
          ]
          pattern = r'<script\s+src=["\']\./exploreup-city-images\.js(?:\?[^"\']*)?["\']\s*></script>'
          if re.search(pattern, s):
              s = re.sub(pattern, tags[0], s, count=1)
          else:
              marker = '</body>'
              s = s.replace(marker, '  ' + tags[0] + '\n' + marker, 1) if marker in s else s + '\n' + tags[0] + '\n'
          alias_pattern = r'<script\s+src=["\']\./arya-v20-district-aliases\.js(?:\?[^"\']*)?["\']\s*></script>'
          if re.search(alias_pattern, s):
              s = re.sub(alias_pattern, tags[1], s, count=1)
          else:
              marker = '</body>'
              s = s.replace(marker, '  ' + tags[1] + '\n' + marker, 1) if marker in s else s + '\n' + tags[1] + '\n'
          bad = re.compile(r'I only answer questions about information and features available inside ExploreUP\.\s*Arya knows the 75-district guides, district-wise Hotels/Stays and Hospitals, Trip Plan Maker, Budget Calculator, Smart Recommendations, and Quick/Smart planning modes\.', re.I)
          replacement = 'I can help with Uttar Pradesh travel, destinations, places, food, hotels, hospitals, shopping, transport, history, culture, trip plans and ExploreUP features.'
          s = bad.sub(replacement, s)
          p.write_text(s, encoding='utf-8')
          Path('exploreup-city-images-trigger.txt').unlink(missing_ok=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-1.html exploreup-city-images-trigger.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Integrate Arya V20 aliases and Hinglish support"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            echo "Push race detected; retry $i/5"
            sleep 5
          done
          exit 1
