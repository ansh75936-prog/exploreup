name: ExploreUP production smoke check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exploreup-production-smoke
  cancel-in-progress: true

jobs:
  smoke-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify production pages and shared assets
        env:
          SITE_URL: https://exploreup-five.vercel.app
        run: |
          node <<'NODE'
          const base = process.env.SITE_URL;
          const pages = [
            "/", "/agra.html", "/ayodhya.html", "/city.html",
            "/favorites.html", "/feedback.html", "/lucknow.html",
            "/nearby.html", "/search.html", "/varanasi.html"
          ];
          const assets = [
            "/css/exploreup-design-system.css",
            "/css/heritage-motion.css",
            "/js/feature-motion.js",
            "/css/heritage-secondary-pages.css?v=20261111-1"
          ];

          async function request(path) {
            const response = await fetch(new URL(path, base), {
              redirect: "follow",
              signal: AbortSignal.timeout(15000),
              headers: { "user-agent": "ExploreUP-Production-Smoke-Check/1.0" }
            });
            return { status: response.status, body: await response.text() };
          }

          let lastError = "Production deployment did not become ready";
          for (let attempt = 1; attempt <= 24; attempt++) {
            try {
              const pageResults = await Promise.all(pages.map(request));
              const assetResults = await Promise.all(assets.map(request));
              const badPages = pageResults
                .map((r, i) => ({ path: pages[i], ...r }))
                .filter(r => r.status !== 200);
              const badAssets = assetResults
                .map((r, i) => ({ path: assets[i], ...r }))
                .filter(r => r.status !== 200);
              const missingStyles = pageResults
                .slice(1)
                .map((r, i) => ({ path: pages[i + 1], body: r.body }))
                .filter(r => !r.body.includes("/css/heritage-secondary-pages.css"));

              const homepage = pageResults[0].body;
              const ayodhya = pageResults[2].body;
              const missingSeo = [];
              if (!ayodhya.includes('application/ld+json') ||
                  !ayodhya.includes('"BreadcrumbList"') ||
                  !ayodhya.includes('https://exploreup-five.vercel.app/ayodhya.html')) {
                missingSeo.push("Ayodhya JSON-LD / canonical URL");
              }
              const missingHomeAssets = [
                "exploreup-design-system.css",
                "heritage-motion.css",
                "feature-motion.js"
              ].filter(name => !homepage.includes(name));

              const missingDiscovery = [];
              const regionMatch = homepage.match(/const regionLists=\{([\s\S]*?)\n \};/);
              const regionBlock = regionMatch?.[1] || "";
              const regionNames = [...regionBlock.matchAll(/^\s*[a-z]+:\[([^\]]*)\]/gm)]
                .flatMap(match => [...match[1].matchAll(/'([^']+)'/g)].map(item => item[1]));
              const expectedRegions = ["awadh", "braj", "rohilkhand", "western", "bundelkhand", "purvanchal"];
              if (!regionMatch || regionNames.length !== 75 || new Set(regionNames).size !== 75 ||
                  expectedRegions.some(region => !homepage.includes('data-region="' + region + '"'))) {
                missingDiscovery.push("Expected six region filters with 75 unique district mappings");
              }

              if (!badPages.length && !badAssets.length &&
                  !missingStyles.length && !missingHomeAssets.length && !missingSeo.length &&
                  !missingDiscovery.length) {
                console.log("PASS: all 10 production pages return HTTP 200.");
                console.log("PASS: homepage design and motion assets are referenced.");
                console.log("PASS: all secondary pages reference the heritage stylesheet.");
                console.log("PASS: all 4 shared assets return HTTP 200.");
                console.log("PASS: Ayodhya WebPage and BreadcrumbList JSON-LD are live.");
                console.log("PASS: six region filters map 75 unique districts.");
                process.exit(0);
              }

              lastError = JSON.stringify({
                badPages, badAssets,
                missingStyles: missingStyles.map(x => x.path),
                missingHomeAssets, missingSeo, missingDiscovery
              });
            } catch (error) {
              lastError = error.message;
            }
            console.log(`Attempt ${attempt}/24: waiting for production rollout — ${lastError}`);
            await new Promise(resolve => setTimeout(resolve, 10000));
          }

          console.error("FAIL: " + lastError);
          process.exit(1);
          NODE
