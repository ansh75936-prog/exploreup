              const missingDiscovery = [];
          if (usesExternalDiscovery && discoveryAsset.status !== 200) missingDiscovery.push("District discovery feature asset must return HTTP 200.");
          if (!discoverySource.includes("window.exploreUpPhase2")) missingDiscovery.push("District tabs and itinerary export must be present.");
              const dashboard = assetResults[assets.indexOf("/js/home-showcase.js")]?.body || "";
              const expectedDashboardCounts = { awadh: 22, braj: 8, purvanchal: 20, bundelkhand: 7 };
              for (const [region, count] of Object.entries(expectedDashboardCounts)) {
                const card = dashboard.match(new RegExp('data-region-jump="' + region + '"[\\s\\S]*?<small>(\\d+) Districts</small>'));
