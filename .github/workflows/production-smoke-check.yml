                "arya-open-state-fix.js"
              ].filter(name => !homepage.includes(name));
              if (!siteShellSource.includes("function toggleReportPanel(") ||
                  !siteShellSource.includes("async function submitInfoReport(") ||
                  !siteShellSource.includes("async function installExploreUP(") ||
                  !siteShellSource.includes("function setupOfflineState(") ||
                  !siteShellSource.includes("function renderGovernmentProfile(")) {
                missingHomeAssets.push("Site shell report, PWA, offline and government profile functions must be available");
              }
              if (!districtRuntimeSource.includes("function syncDistrictCatalog(") ||
                  !districtRuntimeSource.includes("function renderCities(") ||
                  !districtRuntimeSource.includes("function setupDistrictSearch(") ||
                  !districtRuntimeSource.includes("function toggleAllDistricts(") ||
                  !districtRuntimeSource.includes("async function openCity(")) {
                missingHomeAssets.push("District catalog, search, rendering and modal functions must be available");
              }
              if (!supabaseBootstrapSource.includes("const SUPABASE_URL=") ||
                  !supabaseBootstrapSource.includes("function loadSupabaseBackend(") ||
                  !supabaseBootstrapSource.includes("const exploreStorage=")) {
                missingHomeAssets.push("Supabase bootstrap and shared storage helpers must be available");
              }
              if (!aryaOpenStateSource.includes("const getPanel") ||
                  !aryaOpenStateSource.includes("const close") ||
                  !aryaOpenStateSource.includes("const open") ||
                  !aryaOpenStateSource.includes("DOMContentLoaded")) {
                missingHomeAssets.push("Arya open/close state controller must be available");
              }
              if (!stabilitySource.includes("window.__exploreUpLocalSuggestionFallback") ||
                  !stabilitySource.includes("window.__exploreUpReadSuggestionLocal") ||
                  !stabilitySource.includes("new MutationObserver")) {
                missingHomeAssets.push("Homepage feedback and image stability handlers must be available");
              }
              if (!shareAccessibilitySource.includes("exploreupBottomShare") ||
