              for (const [path, canonical] of indexable) {
                const page = pageResults[pages.indexOf(path)]?.body || "";
                const hasRobots = page.includes('name="robots"') && /content=["']index,? ?follow/i.test(page);
                if (!page.includes('rel="canonical"') || !page.includes(canonical) || !hasRobots) {
                  missingSeo.push(path + " canonical or indexable robots metadata");
                }
                if (!/<title/i.test(page) || !page.includes('name="description"')) {
                  missingSeo.push(path + " title or meta description");
                }
              }
              const duplicateHome = legacyHomeResult;
              if (duplicateHome.status !== 200 || !duplicateHome.url.endsWith("/")) {
                missingSeo.push("Legacy index-1.html route must redirect to the canonical homepage");
              }
              const expectedSitemap = indexable.map(([, url]) => url);
              const sitemapUrls = [...sitemapResult.body.matchAll(/<loc>([^<]+)<\/loc>/g)].map(match => match[1]);
              if (sitemapResult.status !== 200 || expectedSitemap.some(url => !sitemapUrls.includes(url)) ||
                  sitemapUrls.some(url => !expectedSitemap.includes(url))) {
                missingSeo.push("Sitemap must list exactly the five canonical indexable pages");
              }
              if (robotsResult.status !== 200 || !robotsResult.body.includes("Sitemap: https://exploreup-five.vercel.app/sitemap.xml")) {
                missingSeo.push("robots.txt must publish the production sitemap");
              }
              if (!ayodhya.includes('application/ld+json') ||
                  !ayodhya.includes('"BreadcrumbList"') ||
                  !ayodhya.includes('https://exploreup-five.vercel.app/ayodhya.html')) {
                missingSeo.push("Ayodhya JSON-LD / canonical URL");
              }
              const missingHomeAssets = [
                "homepage-base.css",
                "homepage-head-overrides.css",
                "homepage-card-navigation.css",
                "homepage-motion-preferences.css",
                "arya-and-district-media.css",
                "district-video-components.css",
                "homepage-final-overrides.css",
                "exploreup-design-system.css",
                "heritage-motion.css",
                "feature-motion.js",
                "arya-core.js",
                "arya-language.js",
                "arya-district-knowledge.js",
                "arya-live-context.js",
                "arya-answer-engine.js",
                "ui-preferences.js",
                "site-shell.js",
                "homepage-stability.js",
                "share-accessibility.js",
                "pwa-runtime.js",
                "district-runtime.js",
