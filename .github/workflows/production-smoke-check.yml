name: ExploreUP production smoke check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exploreup-production-smoke
  cancel-in-progress: true

jobs:
  smoke-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate all district data files
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const html = fs.readFileSync("index.html", "utf8");
          const scriptPaths = html.split("\n")
            .filter(line => line.includes('<script src="./districts/') && line.includes('/data.js"></script>'))
            .map(line => line.match(/src="([^"]+)"/)?.[1].replace("./", ""))
            .filter(Boolean);
          const actualFiles = fs.readdirSync("districts", { withFileTypes: true })
            .filter(entry => entry.isDirectory() && entry.name !== "_template")
            .map(entry => path.posix.join("districts", entry.name, "data.js"))
            .sort();
          const listedFiles = [...scriptPaths].sort();

          if (scriptPaths.length !== 75 || new Set(scriptPaths).size !== 75) {
            throw new Error(`Expected 75 unique district data script tags; found ${scriptPaths.length}.`);
          }
          if (JSON.stringify(listedFiles) !== JSON.stringify(actualFiles)) {
            throw new Error("Homepage district script tags do not match the district data files on disk.");
          }

          const names = [];
          for (const file of actualFiles) {
            const source = fs.readFileSync(file, "utf8");
            const pushes = source.split("window.ExploreUPDistricts.push(").length - 1;
            const name = source.match(/["\']?name["\']?\s*:\s*"([^"]+)"/);
            if (pushes !== 1 || !name) {
              throw new Error(`${file} must contain exactly one district data entry.`);
            }
            names.push(name[1]);
          }
          if (names.length !== 75 || new Set(names).size !== 75) {
            throw new Error("District data must contain 75 unique names.");
          }

          const varanasi = fs.readFileSync("districts/varanasi/data.js", "utf8");
          if (!varanasi.includes("ExploreUP Varanasi video playback recovery")) {
            throw new Error("Varanasi video recovery behavior is missing.");
          }
          console.log("PASS: 75 unique district files are registered exactly once.");
          console.log("PASS: all 75 files contain one unique district data record.");
          console.log("PASS: Varanasi video recovery logic is preserved.");
          NODE

      - name: Verify production pages and shared assets
        env:
          SITE_URL: https://exploreup-five.vercel.app
        run: |
          node <<'NODE'
          const base = process.env.SITE_URL;
          const pages = [
            "/", "/agra.html", "/ayodhya.html", "/city.html",
            "/favorites.html", "/feedback.html", "/index-1.html", "/lucknow.html",
            "/nearby.html", "/search.html", "/varanasi.html"
          ];
          const assets = [
            "/css/exploreup-design-system.css",
            "/css/heritage-motion.css",
            "/js/feature-motion.js",
            "/css/heritage-secondary-pages.css?v=20261111-1"
          ];

          async function request(path) {
            const response = await fetch(new URL(path, base), {
              redirect: "follow",
              signal: AbortSignal.timeout(15000),
              headers: { "user-agent": "ExploreUP-Production-Smoke-Check/1.0" }
            });
            return { status: response.status, body: await response.text() };
          }

          let lastError = "Production deployment did not become ready";
          for (let attempt = 1; attempt <= 24; attempt++) {
            try {
              const pageResults = await Promise.all(pages.map(request));
              const assetResults = await Promise.all(assets.map(request));
              const [sitemapResult, robotsResult] = await Promise.all([request("/sitemap.xml"), request("/robots.txt")]);
              const badPages = pageResults
                .map((r, i) => ({ path: pages[i], ...r }))
                .filter(r => r.status !== 200);
              const badAssets = assetResults
                .map((r, i) => ({ path: assets[i], ...r }))
                .filter(r => r.status !== 200);
              const missingStyles = pageResults
                .slice(1)
                .map((r, i) => ({ path: pages[i + 1], body: r.body }))
                .filter(r => !r.body.includes("/css/heritage-secondary-pages.css"));

              const homepage = pageResults[0].body;
              const ayodhya = pageResults[2].body;
              const missingSeo = [];
              const indexable = [
                ["/", "https://exploreup-five.vercel.app/"],
                ["/agra.html", "https://exploreup-five.vercel.app/agra.html"],
                ["/ayodhya.html", "https://exploreup-five.vercel.app/ayodhya.html"],
                ["/lucknow.html", "https://exploreup-five.vercel.app/lucknow.html"],
                ["/varanasi.html", "https://exploreup-five.vercel.app/varanasi.html"]
              ];
              for (const [path, canonical] of indexable) {
                const page = pageResults[pages.indexOf(path)]?.body || "";
                const hasRobots = page.includes('name="robots"') && /content=["']index,? ?follow/i.test(page);
                if (!page.includes('rel="canonical"') || !page.includes(canonical) || !hasRobots) {
                  missingSeo.push(path + " canonical or indexable robots metadata");
                }
                if (!/<title/i.test(page) || !page.includes('name="description"')) {
                  missingSeo.push(path + " title or meta description");
                }
              }
              const duplicateHome = pageResults[pages.indexOf("/index-1.html")]?.body || "";
              if (!duplicateHome.includes('name="robots"') || !/content=["']noindex,follow/i.test(duplicateHome)) {
                missingSeo.push("Duplicate index-1.html must be noindex,follow");
              }
              const expectedSitemap = indexable.map(([, url]) => url);
              const sitemapUrls = [...sitemapResult.body.matchAll(/<loc>([^<]+)<\/loc>/g)].map(match => match[1]);
              if (sitemapResult.status !== 200 || expectedSitemap.some(url => !sitemapUrls.includes(url)) ||
                  sitemapUrls.some(url => !expectedSitemap.includes(url))) {
                missingSeo.push("Sitemap must list exactly the five canonical indexable pages");
              }
              if (robotsResult.status !== 200 || !robotsResult.body.includes("Sitemap: https://exploreup-five.vercel.app/sitemap.xml")) {
                missingSeo.push("robots.txt must publish the production sitemap");
              }
              if (!ayodhya.includes('application/ld+json') ||
                  !ayodhya.includes('"BreadcrumbList"') ||
                  !ayodhya.includes('https://exploreup-five.vercel.app/ayodhya.html')) {
                missingSeo.push("Ayodhya JSON-LD / canonical URL");
              }
              const missingHomeAssets = [
                "exploreup-design-system.css",
                "heritage-motion.css",
                "feature-motion.js"
              ].filter(name => !homepage.includes(name));

              const missingDiscovery = [];
              const regionMatch = homepage.match(/const regionLists=\{([\s\S]*?)\n \};/);
              const regionBlock = regionMatch?.[1] || "";
              const regionNames = [...regionBlock.matchAll(/^\s*[a-z]+:\[([^\]]*)\]/gm)]
                .flatMap(match => [...match[1].matchAll(/'([^']+)'/g)].map(item => item[1]));
              const expectedRegions = ["awadh", "braj", "rohilkhand", "western", "bundelkhand", "purvanchal"];
              if (!regionMatch || regionNames.length !== 75 || new Set(regionNames).size !== 75 ||
                  expectedRegions.some(region => !homepage.includes('data-region="' + region + '"'))) {
                missingDiscovery.push("Expected six region filters with 75 unique district mappings");
              }

              const missingAccessibility = [];
              if (!homepage.includes('aria-pressed="true"') ||
                  !homepage.includes('aria-hidden=') ||
                  !homepage.includes('pointer-events=') ||
                  !homepage.includes('role="group" aria-label="Interactive schematic map')) {
                missingAccessibility.push("District filters and map nodes must expose accessible states");
              }
              if ((homepage.match(/id="searchInput"/g) || []).length !== 1) {
                missingAccessibility.push("Homepage should keep exactly one primary search input");
              }

              const missingSearchReveal = [];
              if (!homepage.includes("typeof renderCities==='function'") ||
                  !homepage.includes("grid.hidden=false") ||
                  !homepage.includes("q||active!=='all'")) {
                missingSearchReveal.push("Search and region filters must reveal matching district cards");
              }

              const missingMobileLayout = [];
              if (!homepage.includes('id="exploreup-mobile-district-row-layout"') ||
                  !homepage.includes('#cityGrid.cities{') ||
                  !homepage.includes('grid-template-columns:minmax(0,1fr)!important')) {
                missingMobileLayout.push("Mobile district cards must use a single-column row layout");
              }

              const missingMediaStability = [];
              if (!homepage.includes('href="https://fonts.gstatic.com"') ||
                  !homepage.includes('href="https://images.unsplash.com"') ||
                  !homepage.includes('<img width="700" height="460"') ||
                  !homepage.includes('<img width="1000" height="650"') ||
                  !homepage.includes('<img width="1000" height="650" class="city-photo"')) {
                missingMediaStability.push("Image connections and intrinsic dimensions must be declared");
              }

              if (!badPages.length && !badAssets.length &&
                  !missingStyles.length && !missingHomeAssets.length && !missingSeo.length &&
                  !missingDiscovery.length && !missingAccessibility.length && !missingSearchReveal.length && !missingMobileLayout.length && !missingMediaStability.length) {
                console.log("PASS: all 10 production pages return HTTP 200.");
                console.log("PASS: homepage design and motion assets are referenced.");
                console.log("PASS: all secondary pages reference the heritage stylesheet.");
                console.log("PASS: all 4 shared assets return HTTP 200.");
                console.log("PASS: Ayodhya WebPage and BreadcrumbList JSON-LD are live.");
                console.log("PASS: six region filters map 75 unique districts.");
                console.log("PASS: map and filters expose accessible states; one primary search remains.");
                console.log("PASS: search and region filters reveal matching district cards.");
                console.log("PASS: mobile district cards use a single-column row layout.");
                console.log("PASS: image preconnects and intrinsic dimensions are present.");
                process.exit(0);
              }

              lastError = JSON.stringify({
                badPages, badAssets,
                missingStyles: missingStyles.map(x => x.path),
                missingHomeAssets, missingSeo, missingDiscovery, missingAccessibility, missingSearchReveal
              });
            } catch (error) {
              lastError = error.message;
            }
            console.log(`Attempt ${attempt}/24: waiting for production rollout — ${lastError}`);
            await new Promise(resolve => setTimeout(resolve, 10000));
          }

          console.error("FAIL: " + lastError);
          process.exit(1);
          NODE
