name: ExploreUP production smoke check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exploreup-production-smoke
  cancel-in-progress: true

jobs:
  smoke-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate all district data files
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const html = fs.readFileSync("index.html", "utf8");
          // Script-order validation intentionally ignores optional attributes such as defer.
          const districtRuntime = fs.readFileSync("js/district-runtime.js", "utf8");
          const scriptPaths = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)]
            .map(match => match[1].match(/\bsrc=["']\.\/districts\/([^"']+)["']/i)?.[1])
            .filter(Boolean)
            .map(relativePath => path.posix.join("districts", relativePath));
          const actualFiles = fs.readdirSync("districts", { withFileTypes: true })
            .filter(entry => entry.isDirectory() && entry.name !== "_template")
            .map(entry => path.posix.join("districts", entry.name, "data.js"))
            .sort();
          const listedFiles = [...scriptPaths].sort();

          const bootstrapTag = html.match(/<script\b[^>]*\bsrc=["']\.\/js\/supabase-bootstrap\.js(?:\?[^"']*)?["'][^>]*>/i);
          const firstDistrictTag = html.match(/<script\b[^>]*\bsrc=["']\.\/districts\/[^"']+\/data\.js(?:\?[^"']*)?["'][^>]*>/i);
          const bootstrapClose = bootstrapTag
            ? html.indexOf("</script>", bootstrapTag.index)
            : -1;
          if (!bootstrapTag || !firstDistrictTag || bootstrapClose < 0 ||
              bootstrapClose > firstDistrictTag.index) {
            throw new Error("Supabase bootstrap must close before the first district data script begins.");
          }
          if (scriptPaths.length !== 75 || new Set(scriptPaths).size !== 75) {
            throw new Error(`Expected 75 unique district data script tags; found ${scriptPaths.length}.`);
          }
          if (JSON.stringify(listedFiles) !== JSON.stringify(actualFiles)) {
            throw new Error("Homepage district script tags do not match the district data files on disk.");
          }

          const names = [];
          for (const file of actualFiles) {
            const source = fs.readFileSync(file, "utf8");
            const pushes = source.split("window.ExploreUPDistricts.push(").length - 1;
            const name = source.match(/["\']?name["\']?\s*:\s*"([^"]+)"/);
            if (pushes !== 1 || !name) {
              throw new Error(`${file} must contain exactly one district data entry.`);
            }
            names.push(name[1]);
          }
          if (names.length !== 75 || new Set(names).size !== 75) {
            throw new Error("District data must contain 75 unique names.");
          }

          const varanasi = fs.readFileSync("districts/varanasi/data.js", "utf8");
          if (!varanasi.includes("ExploreUP Varanasi video playback recovery")) {
            throw new Error("Varanasi video recovery behavior is missing.");
          }

          const missingDistrictImages = actualFiles.filter(file => {
            const source = fs.readFileSync(file, "utf8");
            const image = source.match(/["']?img["']?\s*:\s*"([^"]*)"/);
            return !image || !image[1].trim();
          });
          const rendererStart = districtRuntime.indexOf("function renderCities(){");
          const rendererEnd = districtRuntime.indexOf(String.fromCharCode(10) + "function ", rendererStart + 1);
          const renderer = districtRuntime.slice(rendererStart, rendererEnd > rendererStart ? rendererEnd : rendererStart + 5000);
          if (!renderer.includes("const imageMarkup=photo ?") ||
              !renderer.includes("${imageMarkup}") ||
              !renderer.includes("display:${fallbackDisplay}")) {
            throw new Error("District cards must render a visible fallback without an empty image request.");
          }

          console.log("PASS: 75 unique district files are registered exactly once.");
          console.log("PASS: all 75 files contain one unique district data record.");
          console.log("PASS: Varanasi video recovery logic is preserved.");
          console.log(`PASS: ${missingDistrictImages.length} districts without supplied photos use the designed fallback and do not request an empty image URL.`);
          NODE

      - name: Verify production pages and shared assets
        env:
          SITE_URL: https://exploreup-five.vercel.app
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.SITE_URL;
          const pages = [
            "/", "/agra.html", "/ayodhya.html", "/city.html",
            "/favorites.html", "/feedback.html", "/lucknow.html",
            "/nearby.html", "/search.html", "/varanasi.html"
          ];
          const assets = [
            "/css/homepage-base.css?v=20261111-1",
            "/css/homepage-head-overrides.css?v=20261111-1",
            "/css/homepage-card-navigation.css?v=20261111-1",
            "/css/homepage-motion-preferences.css?v=20261111-1",
            "/css/arya-and-district-media.css?v=20261111-1",
            "/css/district-video-components.css?v=20261111-1",
            "/css/homepage-final-overrides.css?v=20261111-1",
            "/css/exploreup-design-system.css",
            "/css/heritage-motion.css",
            "/js/feature-motion.js",
            "/css/heritage-secondary-pages.css?v=20261111-1",
            "/js/home-showcase.js",
            "/v21-step2-powerful-search.js?v=20261111-1",
            "/js/homepage-runtime.js?v=20261111-1",
            "/js/arya-core.js?v=20261111-1",
            "/js/arya-language.js?v=20261111-1",
            "/js/arya-district-knowledge.js?v=20261111-1",
            "/js/arya-live-context.js?v=20261111-1",
            "/js/arya-answer-engine.js?v=20261111-1",
            "/js/ui-preferences.js?v=20261111-1",
            "/js/site-shell.js?v=20261111-1",
            "/js/homepage-stability.js?v=20261111-1",
            "/js/share-accessibility.js?v=20261111-1",
            "/js/pwa-runtime.js?v=20261111-1",
            "/js/district-runtime.js?v=20261111-1",
            "/js/supabase-bootstrap.js?v=20261111-1",
            "/js/arya-open-state-fix.js?v=20261111-1"
          ];

          async function request(path) {
            const response = await fetch(new URL(path, base), {
              redirect: "follow",
              signal: AbortSignal.timeout(15000),
              headers: { "user-agent": "ExploreUP-Production-Smoke-Check/1.0" }
            });
            return { status: response.status, body: await response.text(), url: response.url };
          }

          let lastError = "Production deployment did not become ready";
          for (let attempt = 1; attempt <= 24; attempt++) {
            try {
              const pageResults = await Promise.all(pages.map(request));
              const assetResults = await Promise.all(assets.map(request));
              const [sitemapResult, robotsResult, legacyHomeResult] = await Promise.all([request("/sitemap.xml"), request("/robots.txt"), request("/index-1.html")]);
              const badPages = pageResults
                .map((r, i) => ({ path: pages[i], ...r }))
                .filter(r => r.status !== 200);
              const badAssets = assetResults
                .map((r, i) => ({ path: assets[i], ...r }))
                .filter(r => r.status !== 200);
              const missingStyles = pageResults
                .slice(1)
                .map((r, i) => ({ path: pages[i + 1], body: r.body }))
                .filter(r => !r.body.includes("/css/heritage-secondary-pages.css"));

              const homepage = pageResults[0].body;
          const imageFallbackPath = "/js/image-fallback.js?v=20261111-1";
          const usesExternalImageFallback = homepage.includes("image-fallback.js");
          const imageFallbackAsset = usesExternalImageFallback ? await request(imageFallbackPath) : { status: 200, body: "" };
          const imageFallbackSource = usesExternalImageFallback ? imageFallbackAsset.body : homepage;
          const mobileNavigationPath = "/js/mobile-navigation.js?v=20261111-1";
          const usesExternalMobileNavigation = homepage.includes("mobile-navigation.js");
          const mobileNavigationAsset = usesExternalMobileNavigation ? await request(mobileNavigationPath) : { status: 200, body: "" };
          const mobileNavigationSource = usesExternalMobileNavigation ? mobileNavigationAsset.body : homepage;
          const discoveryAssetPath = "/js/district-discovery.js?v=20261111-1";
          const usesExternalDiscovery = homepage.includes("district-discovery.js");
          const discoveryAsset = usesExternalDiscovery ? await request(discoveryAssetPath) : { status: 200, body: "" };
          const discoverySource = usesExternalDiscovery ? discoveryAsset.body : homepage;
              const homepageRuntime = assetResults[assets.indexOf("/js/homepage-runtime.js?v=20261111-1")]?.body || "";
              const aryaLanguageSource = assetResults[assets.indexOf("/js/arya-language.js?v=20261111-1")]?.body || "";
              const aryaAnswerEngineSource = assetResults[assets.indexOf("/js/arya-answer-engine.js?v=20261111-1")]?.body || "";
              const aryaDistrictKnowledgeSource = assetResults[assets.indexOf("/js/arya-district-knowledge.js?v=20261111-1")]?.body || "";
              const aryaLiveContextSource = assetResults[assets.indexOf("/js/arya-live-context.js?v=20261111-1")]?.body || "";
              const districtRuntimeSource = assetResults[assets.indexOf("/js/district-runtime.js?v=20261111-1")]?.body || "";
              const supabaseBootstrapSource = assetResults[assets.indexOf("/js/supabase-bootstrap.js?v=20261111-1")]?.body || "";
              const aryaOpenStateSource = assetResults[assets.indexOf("/js/arya-open-state-fix.js?v=20261111-1")]?.body || "";
              const homepageCardNavigationSource = assetResults[assets.indexOf("/css/homepage-card-navigation.css?v=20261111-1")]?.body || "";
              const homepageMotionPreferencesSource = assetResults[assets.indexOf("/css/homepage-motion-preferences.css?v=20261111-1")]?.body || "";
              const aryaDistrictMediaSource = assetResults[assets.indexOf("/css/arya-and-district-media.css?v=20261111-1")]?.body || "";
              const districtVideoStylesSource = assetResults[assets.indexOf("/css/district-video-components.css?v=20261111-1")]?.body || "";
              const homepageFinalOverridesSource = assetResults[assets.indexOf("/css/homepage-final-overrides.css?v=20261111-1")]?.body || "";

              const stabilitySource = assetResults[assets.indexOf("/js/homepage-stability.js?v=20261111-1")]?.body || "";
              const shareAccessibilitySource = assetResults[assets.indexOf("/js/share-accessibility.js?v=20261111-1")]?.body || "";
              const pwaSource = assetResults[assets.indexOf("/js/pwa-runtime.js?v=20261111-1")]?.body || "";
              const siteShellSource = assetResults[assets.indexOf("/js/site-shell.js?v=20261111-1")]?.body || "";
          const contentAssetPath = "/js/district-content.js?v=20261111-1";
          const usesExternalDistrictContent = homepage.includes("district-content.js");
          const contentAsset = usesExternalDistrictContent ? await request(contentAssetPath) : { status: 200, body: "" };
          const contentSource = usesExternalDistrictContent ? contentAsset.body : homepageRuntime;
          const communityAssetPath = "/js/community-admin.js?v=20261111-1";
          const usesExternalCommunity = homepage.includes("community-admin.js");
          const communityAsset = usesExternalCommunity ? await request(communityAssetPath) : { status: 200, body: "" };
          const communitySource = usesExternalCommunity ? communityAsset.body : homepageRuntime;
          const plannerAssetPath = "/js/trip-planner.js?v=20261111-1";
          const usesExternalPlanner = homepage.includes("trip-planner.js");
          const plannerAsset = usesExternalPlanner ? await request(plannerAssetPath) : { status: 200, body: "" };
          const plannerSource = usesExternalPlanner ? plannerAsset.body : homepageRuntime;
          const dataAssetPath = "/js/homepage-data.js?v=20261111-1";
          const usesExternalHomepageData = homepage.includes("homepage-data.js");
          const homepageDataAsset = usesExternalHomepageData ? await request(dataAssetPath) : { status: 200, body: "" };
          const homepageDataSource = usesExternalHomepageData ? homepageDataAsset.body : homepageRuntime;
              const runtime = homepageRuntime;
              const ayodhya = pageResults[2].body;
