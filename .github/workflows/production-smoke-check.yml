              }
              if (!pwaSource.includes("navigator.serviceWorker.register") ||
                  !pwaSource.includes("checkForUpdate") ||
                  !pwaSource.includes("visibilitychange")) {
                missingHomeAssets.push("PWA registration and deployment update checks must be available");
              }
              if (usesExternalImageFallback && imageFallbackAsset.status !== 200) missingHomeAssets.push("image-fallback.js must return HTTP 200");
              if (!imageFallbackSource.includes("function exploreUpImageFallback(img)")) missingHomeAssets.push("Global image fallback handler must be available");
              if (usesExternalMobileNavigation && mobileNavigationAsset.status !== 200) missingHomeAssets.push("mobile-navigation.js must return HTTP 200");
              if (!mobileNavigationSource.includes("initMobileMenu") ||
                  !mobileNavigationSource.includes("closeMenu") ||
                  !mobileNavigationSource.includes("keydown")) {
                missingHomeAssets.push("Mobile navigation must expose its drawer, close and keyboard handlers");
              }
              if (usesExternalCommunity && communityAsset.status !== 200) missingHomeAssets.push("community-admin.js must return HTTP 200");
              if (!communitySource.includes("function renderSuggestions(") ||
