name: ExploreUP one-time stability batch
on:
  push:
    paths:
      - 'stability-batch-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted stability patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index-1.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- ExploreUP stability batch v1 -->'
          if marker not in s:
              patch=r'''<script>
          /* ExploreUP stability batch v1: feedback/suggestion storage + form safety. */
          (function(){
            'use strict';
            function readSuggestionLocal(city){
              try{
                const v=JSON.parse(exploreStorage.get(suggestionKey(city))||'[]');
                return Array.isArray(v)?v:[];
              }catch(e){return []}
            }
            function writeSuggestionLocal(city,items){
              try{exploreStorage.set(suggestionKey(city),JSON.stringify(Array.isArray(items)?items.slice(-30):[]));return true}catch(e){return false}
            }
            function localSuggestionFallback(city,name,category,text){
              const items=readSuggestionLocal(city);
              items.push({name,category,text,time:new Date().toISOString()});
              return writeSuggestionLocal(city,items);
            }
            window.__exploreUpLocalSuggestionFallback=localSuggestionFallback;
            window.__exploreUpReadSuggestionLocal=readSuggestionLocal;
            window.__exploreUpWriteSuggestionLocal=writeSuggestionLocal;
          })();
          </script>
          <!-- ExploreUP stability batch v1 -->'''
              s=s.replace('</body>',patch+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Patch unsafe suggestion/review functions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index-1.html')
          s=p.read_text(encoding='utf-8')
          old="""function renderSuggestions(city){\n const box=document.getElementById('suggestionsList'); if(!box)return;\n const local=JSON.parse(exploreStorage.get(suggestionKey(city))||'[]');\n box.innerHTML=local.length?local.slice().reverse().map(x=>`<div class=\"suggestion-item\"><b>${escapeHtml(x.category)}</b><div>${escapeHtml(x.text)}</div><small>${escapeHtml(x.name||'Visitor')} · ${new Date(x.time).toLocaleDateString()}</small></div>`).join(''):'<div class=\"suggestion-item\"><small>No approved suggestions yet. Be the first to help improve this district page.</small></div>';\n loadOnlineSuggestions(city);\n}"""
          new="""function renderSuggestions(city){\n const box=document.getElementById('suggestionsList'); if(!box)return;\n const local=typeof window.__exploreUpReadSuggestionLocal==='function'?window.__exploreUpReadSuggestionLocal(city):[];\n box.innerHTML=local.length?local.slice().reverse().map(x=>`<div class=\"suggestion-item\"><b>${escapeHtml(x.category)}</b><div>${escapeHtml(x.text)}</div><small>${escapeHtml(x.name||'Visitor')} · ${new Date(x.time).toLocaleDateString()}</small></div>`).join(''):'<div class=\"suggestion-item\"><small>No approved suggestions yet. Be the first to help improve this district page.</small></div>';\n loadOnlineSuggestions(city);\n}"""
          if old in s: s=s.replace(old,new,1)
          old2="""async function submitReview(e){\n e.preventDefault();const city=currentExploreCity||'';const name=document.getElementById('reviewName').value.trim();const rating=Number(document.getElementById('reviewRating').value);const review_text=document.getElementById('reviewText').value.trim();const st=document.getElementById('reviewStatus');\n try{if(!exploreSupabase)throw new Error('offline');const {error}=await exploreSupabase.from('reviews').insert({district_slug:districtSlug(city),name:name||null,rating,review_text});if(error)throw error;recordOnlineEvent('review_submit',districtSlug(city),{rating});document.getElementById('reviewForm').reset();st.textContent='✓ Thanks! Your review has been submitted for moderation.';st.style.color='green';loadOnlineReviews(city);setTimeout(()=>{st.textContent=''},4000);}catch(err){st.textContent='Review submission needs an online connection. Please try again.';st.style.color='#b45309';}\n}"""
          new2="""async function submitReview(e){\n e.preventDefault();const city=currentExploreCity||'';const name=document.getElementById('reviewName').value.trim();const rating=Number(document.getElementById('reviewRating').value);const review_text=document.getElementById('reviewText').value.trim();const st=document.getElementById('reviewStatus');\n if(!city){st.textContent='Please open a destination before submitting a review.';st.style.color='#b45309';return;}\n if(!Number.isInteger(rating)||rating<1||rating>5){st.textContent='Please select a rating from 1 to 5.';st.style.color='#b45309';return;}\n if(review_text.length<3||review_text.length>1000){st.textContent='Review must be between 3 and 1000 characters.';st.style.color='#b45309';return;}\n if(name.length>100){st.textContent='Name must be 100 characters or fewer.';st.style.color='#b45309';return;}\n try{if(!exploreSupabase)throw new Error('offline');const {error}=await exploreSupabase.from('reviews').insert({district_slug:districtSlug(city),name:name||null,rating,review_text});if(error)throw error;recordOnlineEvent('review_submit',districtSlug(city),{rating});document.getElementById('reviewForm').reset();st.textContent='✓ Thanks! Your review has been submitted for moderation.';st.style.color='green';loadOnlineReviews(city);setTimeout(()=>{st.textContent=''},4000);}catch(err){st.textContent='Review could not be submitted online right now. Please try again.';st.style.color='#b45309';}\n}"""
          if old2 in s: s=s.replace(old2,new2,1)
          old3="""const key=suggestionKey(city),items=JSON.parse(exploreStorage.get(key)||'[]');items.push({name,category,text,time:new Date().toISOString()});exploreStorage.set(key,JSON.stringify(items.slice(-30)));trackSuggestion();"""
          new3="""if(typeof window.__exploreUpLocalSuggestionFallback==='function')window.__exploreUpLocalSuggestionFallback(city,name,category,text);trackSuggestion();"""
          s=s.replace(old3,new3)
          old4="""const key=suggestionKey(city),items=JSON.parse(exploreStorage.get(key)||'[]');items.push({name,category,text,time:new Date().toISOString()});exploreStorage.set(key,JSON.stringify(items.slice(-30)));trackSuggestion();renderSuggestions(city);"""
          new4="""if(typeof window.__exploreUpLocalSuggestionFallback==='function')window.__exploreUpLocalSuggestionFallback(city,name,category,text);trackSuggestion();renderSuggestions(city);"""
          s=s.replace(old4,new4)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patched HTML
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-1.html
          git commit -m 'fix: harden feedback and suggestion forms' || exit 0
          git push
