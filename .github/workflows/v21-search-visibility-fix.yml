name: V21 search visibility fix
on:
  push:
    branches:
      - v21-step2-powerful-search-20260916
    paths:
      - "v21-search-visibility-trigger.txt"
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply targeted search result visibility patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index-1.html')
          s = p.read_text(encoding='utf-8')
          marker = '#results .result,#results .result *{color:#10233f !important}#results .result small{color:#52657f !important}#results .result{background:#fff !important}'
          if marker not in s:
              needle = '#results{display:none;background:white;padding:18px;border-radius:16px;margin-top:12px;box-shadow:0 12px 30px #001b3b20;position:absolute;width:min(700px,90%);z-index:10;color:var(--text)}.result{padding:12px;border-bottom:1px solid #e8eef5;cursor:pointer}.result:last-child{border:0}.result:hover{background:#f4f8fc}.result small{color:var(--muted)}'
              if needle not in s:
                  raise SystemExit('Expected search CSS marker not found; refusing to modify index-1.html')
              s = s.replace(needle, needle + marker, 1)
              p.write_text(s, encoding='utf-8')
          Path('v21-search-visibility-trigger.txt').unlink(missing_ok=True)
          Path('.github/workflows/v21-search-visibility-fix.yml').unlink(missing_ok=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-1.html v21-search-visibility-trigger.txt .github/workflows/v21-search-visibility-fix.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix homepage search result visibility"
          git push origin HEAD:v21-step2-powerful-search-20260916
