name: ExploreUP Stability Step 3
on:
  push:
    paths:
      - 'stability-trigger.txt'
    branches: [main]
jobs:
  fix-favs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Guard favourites JSON parsing
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index-1.html')
          s=p.read_text(encoding='utf-8')
          old="const favs=JSON.parse(exploreStorage.get('exploreup_favs')||'[]');"
          new="let favs=[];try{const v=JSON.parse(exploreStorage.get('exploreup_favs')||'[]');favs=Array.isArray(v)?v:[]}catch(e){favs=[];try{exploreStorage.set('exploreup_favs','[]')}catch(_e){}}"
          if old not in s:
              raise SystemExit('target favourites parse not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-1.html
          git commit -m 'Fix corrupted favourites storage handling'
          git push
